[project]
name = "activv-statement-parser"
version = "0.1.0"
description = "Self-Learning PMS/AIF Statement Parser for Activv Money"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pdfplumber>=0.10.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"] # Pycodestyle, Pyflakes, Isort
ignore = []